step = "1d"
reason = "The roster keeps only the attribute columns the corpus index has; the demo index has none, so the two always-empty attribute columns the engine used to add are gone. Persons, order and groups are identical."

[[difference]]
reference = "S"
stage = "extract"
artifact = "terms_en"
sha256 = "2430255be7ae5a2ba62a48da4bd4bfe2bcd8ae61549f66b2eb7833fdca4fc0e7"
step = "g2"
reason = "Candidate terms are noun phrases found by part-of-speech patterns (nested spans counted, grouped by lemma, shown in their most frequent form; English phrases take no of complement) instead of every sequence of one to four words filtered by the packaged stop-word lists; the TF-IDF scoring is unchanged. The table gains the columns forms (every surface form of a candidate), people and texts (how many use it), band and reason, with the lexicon lab's band rules, the common-modifier rule off (steps 2a2, g2). Then: a single word among the language's stop words, a closed word of another language in a paragraph read as that language, a phrase starting or ending with another language's closed word, and an evenly spread single word are set aside (stop-word, stop-word-edge, even-spread); in a paragraph read as another language, its closed words cut phrases. Then: a candidate must also occur in at least 3 distinct texts (min_texts), so candidates of one or two co-authored texts leave the table. Then: the scores' last digits follow the order in which the extraction counts (at most 3.6e-15 apart)."

[[difference]]
reference = "S"
stage = "extract"
artifact = "terms_fr"
sha256 = "0e2048244d3e59adafa53d058c5a15454ea047db82b73313620c98a3832e2585"
step = "g2"
reason = "Same change as terms_en; French terms with a word of one or two letters (trait de côte, masse d'eau) are now kept whole. Then: stop words and evenly spread single words are set aside (see terms_en). Then: a candidate must also occur in at least 3 distinct texts (min_texts), so candidates of one or two co-authored texts leave the table. Then: the scores' last digits follow the order in which the extraction counts (at most 3.6e-15 apart)."

[[difference]]
reference = "S"
stage = "extract"
artifact = "terms_merged"
sha256 = "cf7cba8179d302b00ec0e5fa7808b9adf82507e3d55fd380df70117d71c1601a"
step = "g2"
reason = "The merged list of the new English and French candidates (see terms_en), with their band and reason (steps 2a2, g2). Then: with the stop-word and even-spread bands (see terms_en). Then: a candidate must also occur in at least 3 distinct texts (min_texts), so candidates of one or two co-authored texts leave the table. Then: the scores' last digits follow the order in which the extraction counts (at most 3.6e-15 apart)."

[[difference]]
reference = "S"
stage = "triage"
upstream = "extract"
step = "2a1"
reason = "The candidates sent to the model changed (see extract), and only the kept and to-check bands are sent since gate G2: other batches, other per-term cache entries and other decisions; the formats of the two caches' keys are unchanged."

[[difference]]
reference = "S"
stage = "build"
upstream = "triage"
step = "2a1"
reason = "Consolidation works from other accepted candidates: other refined terms, language pairs, aliases, vocabulary and IDF, and other per-person, per-group and domain terms. Every surface form of a candidate is an alias, written as the attribution vectorizer counts it. The per-person table also no longer repeats the two always-empty roster attribute columns (step 1d), and the settings record lists the ordered corpus slots instead of per-source switches (step 1c) and the counting unit (step 2a2). Then: each person's row of the space holds every keyword of the vocabulary they use (keywords_per_person empty by default, was 30), stored as people x keywords matrices (models/person_terms.json); the per-person table is each person's best 30 by length-boosted score, for display, and the settings record holds top_n_person null."

[[difference]]
reference = "S"
stage = "space"
upstream = "build"
step = "2a1"
reason = "The SVD input is built from another vocabulary (see build). The hash-only person table also lost the two always-empty roster attribute columns (step 1d). The space is fitted on the texts (themes.space.space_unit text, the rule space_unit_texts): the TF-IDF of the texts, each read once and folded onto the keywords, instead of the people × keywords matrix; the people are placed through that SVD as a projected person is, so every coordinate, singular value and explained variance changes. Then: the vocabulary is every accepted keyword someone uses and each person's row holds all of them (see build)."

[[difference]]
reference = "S"
stage = "group"
upstream = "space"
step = "2a1"
reason = "Terms are clustered in another SVD space (see space)."

[[difference]]
reference = "S"
stage = "layout"
upstream = "space"
step = "2a1"
reason = "The layout places another SVD space (see space). The group aggregate table has one group column instead of equal code and label columns, and the hash-only person table lost the two always-empty roster attribute columns (step 1d). The keywords are no longer placed by UMAP's transform: each goes to the weighted mean of the heaviest linked group of its 8 nearest people in the SVD space (link radius a quarter of the map's radius), so their positions, the diagnostics computed from them and the clustered table's coordinates change; the people's positions do not (gate G2)."

[[difference]]
reference = "S"
stage = "draft"
upstream = "group"
step = "2a1"
reason = "The subfield draft is made from other term groups (see group). Its instructions text also names stages in words (step 1d). Every node is named, in each language, after its most used keyword that has a form there, else after the reference-language form of the most used keyword that has one, so the French labels change and a subfield's no longer repeats its English one (theme names in each language)."

[[difference]]
reference = "S"
stage = "apply"
upstream = "draft"
step = "2a1"
reason = "The draft is applied unchanged, so the applied document and the weights follow it (see draft)."

[[difference]]
reference = "S"
stage = "trajectories"
upstream = "build"
step = "2a1"
reason = "Documents are folded onto another vocabulary and placed on another map (see build and layout). The two zero per-type document counts are also gone (step 1c). Each point and time window is placed on the map by its nearest people (the heaviest linked group of 8) instead of UMAP's transform (gate G2)."

[[difference]]
reference = "S"
stage = "projection"
upstream = "build"
step = "2a1"
reason = "New documents are placed with another vectorizer, SVD space and layout (see build, space and layout). The projected people are placed by their nearest mapped people (the heaviest linked group of 8) instead of UMAP's transform (gate G2)."

[[difference]]
reference = "S"
stage = "bundle"
upstream = "apply"
step = "2a1"
reason = "The bundle carries the new vocabulary, entity terms and taxonomy (see apply); its metadata is also in the map_bundle/2 format (step 1c)."

