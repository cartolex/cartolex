# Differences from the stored reference, each with its reason (docs/dev/reference.md).
# An artifact entry pins the artifact's new hash: any further change is 'different' again.
# A stage entry names an upstream cause instead: it explains every change of the stage
# while that upstream stage has changed too.

[[difference]]
reference = "S"
stage = "roster"
artifact = "persons"
sha256 = "87e2a52b2c6a30c6ad3670d5dffa10ff948007a9d3762329bd5c2e4db0197e7e"
step = "1d"
