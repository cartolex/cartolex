[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartolex"
version = "1.0.0.dev0"
description = "Generic lexical cartography engine: per-entity text corpora -> keywords -> subfields -> 2-D atlas, with projection of new documents into a fitted field"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Elisa Klüger", email = "elisa.kluger@univ-amu.fr"},
  {name = "Pierre Ronceray", email = "pierre.ronceray@univ-amu.fr"},
]
maintainers = [
  {name = "Pierre Ronceray", email = "pierre.ronceray@univ-amu.fr"},
]
# Only direct dependencies, with permissive major-version caps. numba/llvmlite
# are deliberately NOT pinned: the engine never imports them (they are
# umap-learn's JIT backend) and umap-learn's own metadata governs them —
# blanket-pinning them here used to block Python 3.14 for every consumer.
# (The historical <0.63/<0.46 caps existed for Intel-Mac x86_64 wheels;
# Intel-Mac support was retired everywhere on 2026-07-16.)
dependencies = [
  "adjustText>=0.8.1,<2",
  "langdetect>=1.0.9,<2",
  "matplotlib>=3.7.0,<4",
  "mistralai>=1.0,<2",
  "numpy>=1.24.0,<3",
  "pandas>=2.0.0,<4",
  "pdfminer.six>=20231228",
  "pyarrow>=18",
  "pydantic>=2.11,<3",
  "pypdf>=4.0,<7",
  "requests>=2.31.0,<3",
  "scikit-learn>=1.3.0,<2",
  "scipy>=1.10.0,<2",
  "threadpoolctl>=3,<4",
  "umap-learn>=0.5.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  # Exact pin: newer ruff releases also format Python blocks inside Markdown.
  "ruff==0.15.20",
]
docs = [
  "sphinx>=7.2",
  "myst-parser>=3",
  "furo>=2024.1",
]

[tool.setuptools.packages.find]
include = ["cartolex*"]

# The engine's own runtime data (stop-word lists, prompt templates) lives in
# the package, so a wheel, a zip or a checkout all carry it.
[tool.setuptools.package-data]
"cartolex._data" = ["stopwords/*.json", "prompts/*.txt", "prompts/*.md"]
"cartolex.project.schemas" = ["*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
