# Settings for tools/check.py.

[vocab]
# Commit messages scanned for banned terms and co-author trailers: the whole
# history.
commits = "HEAD"
tags = false
# Generated demo worlds (size:seed[:languages]) scanned as well: invented names can match
# real ones. The trilingual worlds hold every Portuguese phrase of the vocabulary.
demo_worlds = ["XS:0", "S:0", "S:1", "L:0", "L:1", "S:0:en,fr,pt", "L:0:en,fr,pt"]

[tests]
# The oldest supported Python: its older standard library and dependency releases are
# where code breaks first (the quick check, lint and docs use the version below, so a
# second version is exercised too). Every other version is tested by CI before a
# release, or here with `--pythons 3.10,3.11,3.12,3.13,3.14`. Each gets its own
# virtual environment in .venvs/.
pythons = ["3.10"]
# The one used by --quick, lint and docs.
quick = "3.12"
# How many Python versions are tested at the same time (memory: each run can
# take a few GB with the large scientific libraries).
jobs = 2
# Worker processes of one Python's tests (pytest-xdist; 1: in one process), and how the
# tests are shared among them: `loadscope` gives a module's tests, hence the demo projects
# its fixtures build, to one worker. Each worker's numerical libraries run one thread.
workers = 12
dist = "loadscope"

[browser]
# Worker processes of the browser checks (each with its own Chromium). They run after the
# other checks, alone, since their budgets measure time.
workers = 4
