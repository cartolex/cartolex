[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cartolex"
version = "1.0.1"
description = "Map a body of texts by the words of their authors: emergent keywords, a lexical space whose distances show who talks the same, themes, co-authorship and an atlas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Elisa Klüger", email = "elisa.kluger@univ-amu.fr"},
  {name = "Pierre Ronceray", email = "pierre.ronceray@univ-amu.fr"},
]
maintainers = [
  {name = "Pierre Ronceray", email = "pierre.ronceray@univ-amu.fr"},
]
keywords = [
  "bibliometrics",
  "keyword extraction",
  "science mapping",
  "text mining",
  "topic maps",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: French",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
]
# Only direct dependencies, with permissive major-version caps. numba/llvmlite
# are deliberately NOT pinned: the engine never imports them (they are
# umap-learn's JIT backend) and umap-learn's own metadata governs them —
# blanket-pinning them here used to block Python 3.14 for every consumer.
# (The historical <0.63/<0.46 caps existed for Intel-Mac x86_64 wheels;
# Intel-Mac support was retired everywhere on 2026-07-16.)
dependencies = [
  "adjustText>=0.8.1,<2",
  # The app (cartolex.app): the web API and the interface's server. Pure Python.
  "fastapi>=0.115,<1",
  "langdetect>=1.0.9,<2",
  "matplotlib>=3.7.0,<4",
  "numpy>=1.24.0,<3",
  "pandas>=2.0.0,<4",
  "pdfminer.six>=20231228",
  "pyarrow>=18",
  "pydantic>=2.11,<3",
  "pypdf>=4.0,<7",
  "python-multipart>=0.0.9",
  "requests>=2.31.0,<3",
  "scikit-learn>=1.3.0,<2",
  "scipy>=1.10.0,<2",
  "spacy>=3.8,<3.9",
  "threadpoolctl>=3,<4",
  "umap-learn>=0.5.5,<0.6",
  "uvicorn>=0.30,<1",
  # The keywords' word cloud (MIT); its SVG embeds the font through fontTools (matplotlib's).
  "wordcloud>=1.9.6,<2",
]

[project.urls]
Homepage = "https://github.com/cartolex/cartolex"
Source = "https://github.com/cartolex/cartolex"
Issues = "https://github.com/cartolex/cartolex/issues"
Changelog = "https://github.com/cartolex/cartolex/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.23223331"

[project.scripts]
cartolex = "cartolex.cli:main"

[project.optional-dependencies]
# The AI clean-up of the keywords by API (the keywords.triage stage): the Mistral SDK,
# imported only when a call is made. Without it the stage says which extra to install.
llm = [
  "mistralai>=1.0,<2",
]
dev = [
  # The test client of the app (starlette.testclient).
  "httpx>=0.27",
  "pytest>=7.0",
  # The checks run the tests in worker processes (tools/check.py).
  "pytest-xdist>=3.5,<4",
  # Exact pin: newer ruff releases also format Python blocks inside Markdown.
  "ruff==0.15.20",
  # The optional extras, tested on every supported Python.
  "mistralai>=1.0,<2",
  "openTSNE>=1.0.4,<2",
]
# The t-SNE layout of a map version (method "tsne"): FFT-accelerated t-SNE,
# BSD-3-Clause, wheels for Python 3.10 to 3.14 on Linux x86-64, macOS and Windows.
tsne = [
  "openTSNE>=1.0.4,<2",
]
docs = [
  "sphinx>=7.2",
  "myst-parser>=3",
  "furo>=2024.1",
]

[tool.setuptools.packages.find]
include = ["cartolex*"]

# The engine's own runtime data (stop-word lists, prompt templates) lives in
# the package, so a wheel, a zip or a checkout all carry it.
[tool.setuptools.package-data]
"cartolex._data" = [
  "stopwords/*.json", "prompts/*.txt", "prompts/*.md", "rejects/*.json",
  "fonts/*.ttf", "fonts/*.txt", "fonts/*.md",
  # the build stamp, when tools/build_stamp.py wrote it (not tracked)
  "build.json",
]
"cartolex.project.schemas" = ["*.schema.json"]
"cartolex.app" = ["static/**/*"]
"cartolex.site" = ["assets/*", "i18n/*.json"]
"cartolex.app.schemas" = ["*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
