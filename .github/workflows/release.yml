# Build the source archive, the wheel and the installer kit, check what they
# hold, and install the wheel on each system as a new user would
# (tools/install_check.py).
#
# Started by hand (Actions → Release build → Run workflow), the archives are
# only kept as the run's artifact. Started by pushing a tag vX.Y.Z equal to the
# version in pyproject.toml, they are then published: the wheel and the source
# archive on PyPI (trusted publishing, environment `pypi`), then a GitHub
# release with all three and the version's CHANGELOG section. Zenodo archives
# that release and gives it its DOI.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  MPLBACKEND: Agg

jobs:
  build:
    name: build the archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - uses: astral-sh/setup-uv@v6
      - name: The documentation, built into the package (the app serves it)
        run: uv run --no-project --python 3.12 --with "sphinx>=7.2" --with "myst-parser>=3" --with "furo>=2024.1" tools/build_docs.py
      - name: The build stamp (the commit and its date, shown by the app)
        run: uv run --no-project --python 3.12 tools/build_stamp.py
      - name: Source archive, then the wheel built from it
        run: uv build --out-dir dist
      - name: What they hold
        run: uv run --no-project --python 3.12 tools/package_check.py --docs --stamp dist/*.whl dist/*.tar.gz
      - name: The installer kit (launchers that install this version from the package index)
        run: uv run --no-project --python 3.12 tools/installer_zip.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  install:
    name: install, ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Fresh environments, Python 3.10 and 3.14
        shell: bash
        run: uv run --no-project --python 3.12 tools/install_check.py --wheel dist/*.whl
      - name: The installer kit's launcher, from the built wheel
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARTOLEX_HOME: ${{ runner.temp }}/cartolex-kit
        run: |
          mkdir -p "$RUNNER_TEMP/kit" && cd "$RUNNER_TEMP/kit"
          unzip -q "$GITHUB_WORKSPACE"/dist/cartolex-installer-*.zip
          CARTOLEX_WHEEL="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" bash cartolex-installer-*/install-cartolex.sh </dev/null
          "$CARTOLEX_HOME/env/bin/cartolex" models list
      - name: The installer kit's launcher, from the built wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARTOLEX_HOME: ${{ runner.temp }}\cartolex-kit
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\kit" | Out-Null
          $zip = Get-ChildItem dist\cartolex-installer-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\kit"
          $env:CARTOLEX_WHEEL = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          $launcher = Get-ChildItem "$env:RUNNER_TEMP\kit" -Recurse -Filter install-cartolex.ps1 | Select-Object -First 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:CARTOLEX_HOME\env\Scripts\cartolex.exe" models list

  pypi:
    name: publish on PyPI
    needs: install
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cartolex/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Only the wheel and the source archive (the installer kit goes to the GitHub release)
        run: mkdir pypi && mv dist/*.whl dist/*.tar.gz pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: The release, with the version's CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " {on = index($0, "## " v " ") == 1; next} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "cartolex $version" --notes-file notes.md --verify-tag
