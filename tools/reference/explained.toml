[[difference]]
reference = "S"
stage = "build"
upstream = "triage"
step = "2a1"
reason = "Consolidation works from other accepted candidates: other refined terms, language pairs, aliases, vocabulary and IDF, and other per-person, per-group and domain terms. Every surface form of a candidate is an alias, written as the attribution vectorizer counts it. The per-person table also no longer repeats the two always-empty roster attribute columns (step 1d), and the settings record lists the ordered corpus slots instead of per-source switches (step 1c) and the counting unit (step 2a2)."

[[difference]]
